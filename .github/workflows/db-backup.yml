name: Encrypted offsite DB backup

# Nightly logical backup of the Neon Postgres database, stored encrypted on
# GitHub's infrastructure (offsite from Neon) with 30-day retention. Neon's
# built-in point-in-time restore covers short-window recovery; this covers
# provider-level loss and long-lived, portable snapshots.

on:
  schedule:
    - cron: "15 8 * * *" # 08:15 UTC ≈ 02:15 America/Denver
  workflow_dispatch: {} # allow manual "Run workflow" / gh workflow run

concurrency:
  group: db-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Surfaced as env so the optional S3 step can gate on it (the `secrets`
      # context is not allowed inside `if:` expressions).
      BACKUP_S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
    steps:
      - name: Install PostgreSQL 17 client
        run: |
          set -euo pipefail
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
          # Put the v17 client ahead of the runner's preinstalled v16 wrapper.
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
          /usr/lib/postgresql/17/bin/pg_dump --version

      - name: Dump, verify, and encrypt
        env:
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [ -z "${BACKUP_DATABASE_URL:-}" ] || [ -z "${BACKUP_PASSPHRASE:-}" ]; then
            echo "::error::BACKUP_DATABASE_URL and BACKUP_PASSPHRASE repository secrets are required."
            exit 1
          fi
          STAMP="$(date -u +%Y%m%d-%H%M%S)"
          FILE="makeready-${STAMP}.dump"
          # Custom format (-Fc): compressed, supports selective pg_restore.
          pg_dump --format=custom --no-owner --no-privileges \
            --file="${FILE}" "${BACKUP_DATABASE_URL}"
          # Integrity check: a valid archive lists its table of contents.
          pg_restore --list "${FILE}" >/dev/null
          BYTES="$(stat -c%s "${FILE}")"
          echo "Dump OK: ${FILE} (${BYTES} bytes)"
          if [ "${BYTES}" -lt 1024 ]; then
            echo "::error::Dump is suspiciously small (${BYTES} bytes)."; exit 1
          fi
          # Symmetric AES-256 encryption; passphrase never touches disk.
          gpg --batch --yes --symmetric --cipher-algo AES256 \
            --passphrase "${BACKUP_PASSPHRASE}" --output "${FILE}.gpg" "${FILE}"
          rm -f "${FILE}"
          echo "ARTIFACT_NAME=makeready-db-${STAMP}" >> "$GITHUB_ENV"
          echo "ARTIFACT_FILE=${FILE}.gpg" >> "$GITHUB_ENV"

      - name: Upload encrypted backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.ARTIFACT_FILE }}
          retention-days: 30
          if-no-files-found: error

      # Optional: also push to S3-compatible object storage (AWS S3 / Cloudflare
      # R2) for longer retention. Runs only when the S3 secrets are configured.
      - name: Mirror to S3-compatible storage (optional)
        if: ${{ env.BACKUP_S3_BUCKET != '' }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.BACKUP_S3_REGION }}
          S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
          S3_ENDPOINT: ${{ secrets.BACKUP_S3_ENDPOINT }}
        run: |
          set -euo pipefail
          ENDPOINT_ARG=""
          if [ -n "${S3_ENDPOINT:-}" ]; then ENDPOINT_ARG="--endpoint-url ${S3_ENDPOINT}"; fi
          aws ${ENDPOINT_ARG} s3 cp "${ARTIFACT_FILE}" "s3://${S3_BUCKET}/db-backups/${ARTIFACT_FILE}"
