<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Offline · MakeReady</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#0f172a" />
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: #f5f5f5; color: #171717;
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      padding: 24px;
    }
    .card {
      max-width: 380px; width: 100%; text-align: center;
      background: #fff; border: 1px solid #e5e5e5; border-radius: 16px;
      padding: 32px 24px; box-shadow: 0 1px 3px rgba(0,0,0,.06);
    }
    .logo { margin: 0 auto 20px; height: 64px; width: auto; display: block; }
    .icon { font-size: 40px; margin-bottom: 12px; }
    h1 { font-size: 18px; margin: 0 0 8px; }
    p { font-size: 14px; color: #737373; margin: 0 0 20px; line-height: 1.5; }
    button {
      appearance: none; border: 0; cursor: pointer;
      background: #0f172a; color: #fff; font-weight: 600; font-size: 14px;
      border-radius: 10px; padding: 10px 20px;
    }
    button:hover { background: #1f2937; }
  </style>
</head>
<body>
  <div class="card">
    <img class="logo" src="/makeready-logo.png" alt="MakeReady by G54" />
    <div class="icon">📶</div>
    <h1>You're offline</h1>
    <p>MakeReady needs a connection to load live orders, quotes, and customer data. Reconnect and try again — anything already open stays put.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
  <script>
    // Auto-recover the moment the connection returns.
    window.addEventListener("online", function () { location.reload(); });
  </script>
</body>
</html>
